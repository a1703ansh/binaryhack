services:
  db:
    image: postgres:16-alpine
    container_name: earnwise-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: earnwise
      POSTGRES_PASSWORD: earnwise_dev
      POSTGRES_DB: earnwise
    ports:
      - "5433:5432"
    volumes:
      - earnwise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earnwise -d earnwise"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  earnwise_pgdata: